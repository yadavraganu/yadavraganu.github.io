<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anurag Yadav – Senior Data Engineer</title>
<meta name="description" content="Senior Data Engineer">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel-soft:#fafbfc; --ink:#182033; --muted:#596579; --line:#d9dee8; --accent:#2457a6; --accent-strong:#173d73; --chip:#edf1f5; --flow:#edf3fb;
  --shadow:0 12px 32px rgba(30,41,59,.07); --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ color-scheme:light; }
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:linear-gradient(135deg,var(--bg),var(--panel-soft));color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration-thickness:.08em;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sample{background:var(--accent);color:var(--bg);text-align:center;padding:6px 12px;font-size:.9rem}
.wrap{max-width:1360px;margin:0 auto;padding:48px 24px 96px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:56px}
aside{position:sticky;top:24px;align-self:start;padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
h1{font:600 2.3rem/1.1 Georgia,"Iowan Old Style",serif;letter-spacing:-.02em;margin:0 0 8px}
.headline{color:var(--muted);margin:0 0 20px}
aside ul{list-style:none;margin:0 0 24px;padding:0}
aside li{margin:0 0 8px}
aside li a{display:block;color:var(--ink);text-decoration:none;font-weight:600}
aside li a:hover{color:var(--accent)}
nav{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:16px}
nav a{display:block;padding:7px 10px;margin:1px 0;border-radius:8px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:600}
nav a:hover{color:var(--accent-strong);background:var(--flow)}
.status{border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:10px;padding:12px 14px;background:var(--flow);color:var(--ink);font-size:.86rem;margin-top:24px}
section{margin:0 0 56px;scroll-margin-top:24px}
h2{font:600 1.65rem/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--line);position:relative}
h2:after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:3px;border-radius:3px;background:var(--accent)}
p{margin:0 0 12px;max-width:68ch}
.impact{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:24px 0 0}
.impact div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.impact b{display:block;font:600 1.5rem/1.2 Georgia,serif}
.impact span{color:var(--muted);font-size:.9rem}
.timeline{position:relative;margin-left:10px;padding-left:32px}
.timeline:before{content:"";position:absolute;top:18px;bottom:18px;left:6px;width:2px;background:var(--line)}
.job{--job-color:#14b8a6;position:relative;margin:0 0 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--job-color);border-radius:var(--radius);padding:18px 20px;box-shadow:0 5px 18px rgba(30,41,59,.05)}
.job.blue{--job-color:#3b82f6}
.job.red{--job-color:#ef4444}
.job.violet{--job-color:#8b5cf6}
.job.amber{--job-color:#f59e0b}
.timeline-dot{position:absolute;left:-34px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--job-color);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--job-color)}
.job-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px}
.job h3{margin:0;font-size:1.1rem;color:var(--job-color)}
.proj h3{margin:0;font-size:1.22rem;color:var(--accent-strong)}
.org{margin:2px 0;color:var(--ink);font-weight:600}
.meta{flex-shrink:0;max-width:none;border-radius:999px;background:var(--chip);color:var(--muted);font-size:.85rem;margin:0;padding:4px 10px}
ul.b{margin:0;padding-left:20px;max-width:68ch}
ul.b li{margin:0 0 6px}
.proj{--project-accent:#2457a6;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--project-accent);border-radius:var(--radius);padding:26px 28px;margin:0 0 22px;box-shadow:var(--shadow)}
.proj.blue{--project-accent:#2457a6}
.proj.teal{--project-accent:#39766f}
.proj.violet{--project-accent:#52647c}
.proj-kicker{color:var(--project-accent)!important;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
.proj h3{position:relative;color:var(--ink);font-size:1.28rem}
.proj p,.proj ul{max-width:none;text-wrap:pretty}
.proj>ul:not(.chips){margin-top:10px;padding:16px 20px 16px 38px;border-left:3px solid var(--line-strong,var(--line));border-radius:0 10px 10px 0;background:#f7f8fa}
.proj>ul:not(.chips) li{margin-bottom:7px;padding-left:3px}
.proj>ul:not(.chips) li:last-child{margin-bottom:0}
#about p,#about ul.b{max-width:none;text-wrap:pretty}
.project-details{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:16px 0 20px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--line);overflow:hidden}
.project-details div{display:block;min-height:68px;background:#f8fafc;padding:10px 12px;margin:0}
.project-details div:last-child{grid-column:1/-1}
.project-details dt{font-weight:600;color:var(--muted)}
.project-details dd{margin:2px 0 0;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.flow span{background:var(--flow);border-radius:6px;padding:3px 10px;font-size:.86rem}
.flow i{color:var(--muted);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:8px 0 0;padding:0}
.chips li{border:1px solid transparent;border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:650}
.chips li.tech{background:#173d73;color:#ffffff;border-color:#173d73}
.chips li.platform{background:#285d57;color:#ffffff;border-color:#285d57}
.chips li.tool{background:#665b43;color:#ffffff;border-color:#665b43}
.chips li.database{background:#493e68;color:#ffffff;border-color:#493e68}
.chips li.cloud{background:#31536d;color:#ffffff;border-color:#31536d}
.skills{display:grid;grid-template-columns:170px 1fr;gap:0;margin:0;padding:18px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.skills dt,.skills dd{padding:10px 0;border-bottom:1px solid var(--line)}
.skills dt:nth-last-child(2),.skills dd:last-child{border-bottom:0}
.skills dt{font-weight:600}
.skills dd{margin:0;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two>div{padding:20px 22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
#writing ul{padding:18px 18px 18px 38px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.small{font-size:.95rem;margin:0 0 6px}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:32px;padding-top:28px}
  aside{position:static}
  nav{display:none}
  .skills,.two{grid-template-columns:1fr}
  .job-header{flex-direction:column;gap:10px}
  .meta{flex-shrink:1}
  .project-details{grid-template-columns:repeat(2,minmax(0,1fr))}
  .project-details div:last-child{grid-column:1/-1}
}
@media (max-width:520px){
  .project-details{grid-template-columns:1fr}
  .project-details div:last-child{grid-column:auto}
  .proj{padding:22px 20px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Anurag Yadav</h1>
    <p class="headline">Senior Data Engineer · Pune, India</p>
    <ul>
      <li><a href="https://www.linkedin.com/in/yadavraganu/" rel="me noopener">LinkedIn</a></li>
      <li><a href="https://github.com/yadavraganu" rel="me noopener">GitHub</a></li>
      <li><a href="https://www.credly.com/users/yadavraganu/badges/credly">Credly</a></li>
      <li><a href="https://www.credential.net/profile/raganu/wallet">Accredible</a></li>
    </ul>
    <nav aria-label="Sections">
      <a href="#about">About</a><a href="#experience">Experience</a><a href="#projects">Projects</a>
      <a href="#skills">Skills</a><a href="#credentials">Education and Certifications</a>
    </nav>
    <p class="status">Currently open to senior and staff data engineering roles. Replies within two days.</p>
  </aside>

  <main>
    <div data-section="about.html"></div>
    <div data-section="experience.html"></div>
    <div data-section="projects.html"></div>
    <div data-section="skills.html"></div>
    <div data-section="credentials.html"></div>
  </main>
</div>

<script>
(async () => {
  for (const slot of document.querySelectorAll('[data-section]')) {
    try {
      const response = await fetch(slot.dataset.section);
      if (!response.ok) throw new Error(`Could not load ${slot.dataset.section}`);
      slot.innerHTML = await response.text();
    } catch (error) {
      slot.innerHTML = `<p>Unable to load <strong>${slot.dataset.section}</strong>.</p>`;
      console.error(error);
    }
  }
  if (location.hash) {
    requestAnimationFrame(() => document.querySelector(location.hash)?.scrollIntoView());
  }
})();
</script>
</body>
</html>
